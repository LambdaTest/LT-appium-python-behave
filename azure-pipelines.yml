trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # These will come from Azure DevOps secret variables
  LT_USERNAME: $(LT_USERNAME)
  LT_ACCESS_KEY: $(LT_ACCESS_KEY)

steps:

# Setup Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.9'
  displayName: 'Set up Python 3.9'

# Install dependencies
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install requirements'

# Run Behave tests
- script: |
    python -m behave --tags @androidApp --junit --junit-directory test-results
  displayName: 'Run LambdaTest Behave Tests'
  env:
    LT_USERNAME: $(LT_USERNAME)
    LT_ACCESS_KEY: $(LT_ACCESS_KEY)

# Publish test results
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/test-results/*.xml'
    testRunTitle: 'Behave Test Results'
  condition: succeededOrFailed()
